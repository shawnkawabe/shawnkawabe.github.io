version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # @react-three/fiber 9 peers on react/react-dom >=19 <19.4; lift when R3F allows it.
      - dependency-name: react
        versions: ['>=19.4.0']
      - dependency-name: react-dom
        versions: ['>=19.4.0']
      # typescript-eslint 8 refuses TS 7 ("does not support TS 7.0"); lift when it does.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # eslint-plugin-jsx-a11y 6.10.2 (latest) peers on eslint <=9, @eslint/js 10 and
      # eslint-plugin-astro 3 need eslint 10; move all four together once jsx-a11y allows it.
      - dependency-name: eslint
        versions: ['>=10.0.0']
      - dependency-name: '@eslint/js'
        versions: ['>=10.0.0']
      - dependency-name: eslint-plugin-astro
        versions: ['>=3.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

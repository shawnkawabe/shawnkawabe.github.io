<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SK monogram (BACKLOG-LANDING L-14, L-31): white strokes on an accent tile, drawn as paths so it
       needs no font. The tile runs from accent-1 (dark theme) to accent-1 (light theme), so it reads
       on light and dark tabs. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA9FF" />
      <stop offset="1" stop-color="#0B5CD5" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#tile)" />
  <g transform="translate(1 0.2)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.6 10.6C12.9 9.4 11.7 8.7 10.1 8.7 8 8.7 6.6 9.9 6.6 11.6c0 1.8 1.4 2.5 3.4 3.1 2.2.7 3.8 1.6 3.8 3.8 0 2.1-1.6 3.6-3.9 3.6-1.9 0-3.3-.9-4-2.4" />
    <path d="M18 8.9v13.2M24.4 8.9l-6.4 6.8M20.4 13.5l4.4 8.6" />
  </g>
</svg>
